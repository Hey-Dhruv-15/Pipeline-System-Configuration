services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: pipeline-demo-secret-key
      PIPELINE_DATA_ROOT: /opt/airflow/data
      PIPELINE_DATA_FORMAT: delta
    command: >
      bash -c "chmod -R 777 /opt/airflow/data /opt/airflow/dags /opt/airflow/src /opt/airflow/demo_data /opt/airflow/samples &&
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"
    restart: "no"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./demo_data:/opt/airflow/demo_data
      - ./samples:/opt/airflow/samples

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: pipeline-demo-secret-key
      PIPELINE_DATA_ROOT: /opt/airflow/data
      PIPELINE_DATA_FORMAT: delta
    command: >
      bash -c "chmod -R 777 /opt/airflow/data /opt/airflow/dags /opt/airflow/src /opt/airflow/demo_data /opt/airflow/samples &&
      rm -f /opt/airflow/airflow-webserver.pid &&
      airflow webserver"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./demo_data:/opt/airflow/demo_data
      - ./samples:/opt/airflow/samples

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: pipeline-demo-secret-key
      PIPELINE_DATA_ROOT: /opt/airflow/data
      PIPELINE_DATA_FORMAT: delta
    command: >
      bash -c "chmod -R 777 /opt/airflow/data /opt/airflow/dags /opt/airflow/src /opt/airflow/demo_data /opt/airflow/samples &&
      airflow scheduler"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./demo_data:/opt/airflow/demo_data
      - ./samples:/opt/airflow/samples

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      PIPELINE_DATA_ROOT: /app/data
      PIPELINE_DATA_FORMAT: delta
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./demo_data:/app/demo_data
      - ./src:/app/src

  pipeline-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      PIPELINE_DATA_ROOT: /workspace/data
      PIPELINE_DATA_FORMAT: delta
    command: python -m src.pipeline.data_pipeline
    volumes:
      - .:/workspace

  backend-simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      PIPELINE_DATA_ROOT: /workspace/data
      PIPELINE_DATA_FORMAT: delta
      PIPELINE_BACKEND_GENERATION_INTERVAL_SECONDS: 20
      PIPELINE_BACKEND_BATCH_SIZE: 3
    command: python -m src.pipeline.backend_simulator
    volumes:
      - .:/workspace

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      PIPELINE_DATA_ROOT: /workspace/data
      PIPELINE_DATA_FORMAT: delta
    command: python -m src.mcp_server.server
    volumes:
      - .:/workspace

volumes:
  postgres_data:
