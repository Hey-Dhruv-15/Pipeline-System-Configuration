name: 🐛 Bug Report
description: Report a broken parser, self-healing failure, or pipeline crash
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is failing?
      placeholder: e.g. Spark Ingestion, Quality Engine, MCP Server, Airflow DAG, Streamlit Dashboard
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or input data that triggers the issue.
      placeholder: |
        1. Place sample input file in data/raw/
        2. Execute python -m src.pipeline.data_pipeline
        3. Observe error trace
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead (e.g. self-healing rule auto-heals record, or routes to quarantine).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Terminal Output
      description: Paste any relevant error logs or stack traces here.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System & Execution Environment
      options:
        - Docker Compose (Linux container)
        - Linux (Host)
        - macOS
        - Windows
    validations:
      required: true
